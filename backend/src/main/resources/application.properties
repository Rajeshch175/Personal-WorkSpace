spring.application.name=personal-workspace-api
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/workspace}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
workspace.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
